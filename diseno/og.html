<!doctype html>
<!-- Fuente de static/img/og.jpg (1200×630). Para regenerarla:
     chrome --headless --hide-scrollbars --window-size=1200,630 --screenshot=static/img/og.jpg diseno/og.html -->
<html lang="es-PE">
<meta charset="utf-8">
<style>
  html, body { margin:0; width:1200px; height:630px; }
  body { box-sizing:border-box; padding:72px 84px; display:flex; flex-direction:column; justify-content:space-between;
         font-family:"Segoe UI", system-ui, sans-serif; color:#fff;
         background:linear-gradient(135deg, #0b6bcb 0%, #084d93 100%); }
  .marca { font-size:36px; font-weight:700; opacity:.9; }
  h1 { margin:0; font-size:88px; line-height:1.05; letter-spacing:-1px; }
  .formula { margin-top:28px; font-size:34px; opacity:.9; }
  .pie { display:flex; gap:18px; font-size:30px; font-weight:600; }
  .pie span { background:rgba(255,255,255,.16); padding:10px 22px; border-radius:999px; }
</style>
<body>
  <div class="marca">CalculaPerú</div>
  <div>
    <h1>Calcula tu CTS<br>en segundos</h1>
    <div class="formula">Según la ley peruana, con la fórmula explicada</div>
  </div>
  <div class="pie"><span>Gratis</span><span>Sin registrarte</span><span>Mayo y noviembre</span></div>
</body>
</html>
